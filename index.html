<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Week</title>
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Week">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Week <span id="weekNo"></span></h1>
      <p id="range" class="range"></p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" data-tab="week" aria-controls="view-week">Week</button>
      <button role="tab" data-tab="meals" aria-controls="view-meals">Meals</button>
      <button role="tab" data-tab="gym" aria-controls="view-gym">Gym</button>
    </nav>
    <div class="stats" id="stats" aria-live="polite"></div>
    <nav class="nav" aria-label="Change week">
      <button class="nav-btn" data-nav="-1" aria-label="Previous week">&#8249;</button>
      <button class="nav-btn today-btn" data-nav="0">Today</button>
      <button class="nav-btn" data-nav="1" aria-label="Next week">&#8250;</button>
    </nav>
  </header>

  <main>
    <section id="view-week" class="view layout" role="tabpanel">
      <aside class="anytime" aria-labelledby="anyTitle">
        <div class="anytime-head">
          <h2 id="anyTitle">Anytime</h2>
          <button class="text-btn" data-action="clear-done" id="clearDone" hidden>Clear done</button>
        </div>
        <ul class="list" id="anyList" data-drop="anytime"></ul>
        <form class="add" data-add="anytime">
          <input name="text" maxlength="140" placeholder="Add task" aria-label="Add a task for anytime" enterkeyhint="done">
        </form>
      </aside>
      <div class="week-col">
        <div class="strip" id="strip" role="tablist" aria-label="Days"></div>
        <ol class="week" id="week"></ol>
      </div>
    </section>

    <section id="view-meals" class="view pad" role="tabpanel" hidden>
      <div class="two">
        <form id="mealForm" class="card meal-form" autocomplete="off">
          <h2 id="mealFormTitle">New meal</h2>
          <input type="hidden" name="id">
          <input class="field" name="name" maxlength="60" placeholder="Name" aria-label="Meal name" required>
          <textarea class="field" name="ingredients" rows="5" maxlength="1000" placeholder="Ingredients, one per line" aria-label="Ingredients, one per line"></textarea>
          <div class="row-btns">
            <button class="btn">Save</button>
            <button type="button" class="text-btn" data-action="cancel-meal" id="cancelMeal" hidden>Cancel</button>
          </div>
        </form>
        <div>
          <ul class="meal-list" id="mealList"></ul>
        </div>
      </div>
    </section>

    <section id="view-gym" class="view pad" role="tabpanel" hidden>
      <div class="two gym">
        <section class="card" aria-labelledby="liftTitle">
          <h2 id="liftTitle">Lifts</h2>
          <div id="lifts"></div>
          <form id="exForm" class="ex-form" autocomplete="off">
            <input class="field" name="name" maxlength="40" placeholder="Exercise" aria-label="Exercise name" required>
            <label class="mini">Sets <input class="field" name="sets" type="number" inputmode="numeric" min="1" max="10" value="3"></label>
            <label class="mini">Reps <input class="field" name="reps" type="number" inputmode="numeric" min="1" max="50" value="8"></label>
            <label class="mini">+kg <input class="field" name="step" type="number" inputmode="decimal" min="0.5" max="20" step="0.5" value="2.5"></label>
            <button class="btn">Add</button>
          </form>
        </section>
        <section class="card" aria-labelledby="runTitle">
          <h2 id="runTitle">Running</h2>
          <div id="running"></div>
        </section>
      </div>
    </section>
  </main>

  <nav class="bottombar" aria-label="Sections">
    <button data-tab="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Week</span></button>
    <button data-tab="anytime"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="6" cy="17" r="1.6"/><path d="M10 7h10M10 12h10M10 17h10"/></svg><span>Anytime</span></button>
    <button data-tab="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v6M9 3v6M16 21V3c2.5 1 3.5 4 3.5 8H16"/></svg><span>Meals</span></button>
    <button data-tab="gym"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Gym</span></button>
  </nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
    <div id="sheetBody"></div>
  </dialog>

  <datalist id="mealOptions"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
